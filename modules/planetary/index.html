  <!-- Back-to-root-index nav (injected; independent of the React bundle) -->
  <style>
    .wo-home-bar{position:relative;z-index:60;display:flex;align-items:center;justify-content:flex-start;padding:10px 16px;background:linear-gradient(180deg,#0c0e17 0%,rgba(12,14,23,.85) 100%);border-bottom:1px solid rgba(255,215,0,.25)}
    .wo-home-btn{display:inline-flex;align-items:center;gap:.55em;padding:.55em 1.15em;border-radius:999px;font:700 13px/1 "JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#1a1204;background:linear-gradient(135deg,#fff3b0 0%,#ffd700 45%,#ffb300 100%);border:1px solid #fff6c8;box-shadow:0 0 0 1px rgba(255,215,0,.35),0 0 18px rgba(255,200,40,.55),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;animation:wo-home-glow 2.8s ease-in-out infinite}
    .wo-home-btn:hover{transform:translateY(-1px) scale(1.04);filter:brightness(1.08);box-shadow:0 0 0 1px rgba(255,215,0,.6),0 0 28px rgba(255,210,60,.85),inset 0 1px 0 rgba(255,255,255,.8)}
    .wo-home-btn:active{transform:translateY(0) scale(.98)}
    .wo-home-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
    .wo-home-arrow{font-size:1.15em;transition:transform .18s ease}
